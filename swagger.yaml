  # PAYMENT (Candidate — mua token)
  # ══════════════════════════════════════════════════════════════════

  /payment/token:
    get:
      tags: [Payment]
      summary: Trang chọn gói mua lượt ứng tuyển (Candidate)
      operationId: tokenPurchasePage
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang chọn gói token

    post:
      tags: [Payment]
      summary: Khởi tạo link thanh toán VNPay mua token (Candidate)
      operationId: initiateTokenPurchase
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [package]
              properties:
                package:
                  type: integer
                  description: Gói token (1=5 lượt, 2=10 lượt, 3=20 lượt)
                  enum: [1, 2, 3]
                  example: 1
      responses:
        "302":
          description: Redirect đến URL thanh toán VNPay

  /payment/token/callback:
    get:
      tags: [Payment]
      summary: Callback VNPay sau khi mua token (người dùng redirect về)
      operationId: tokenCallback
      security:
        - cookieAuth: []
      parameters:
        - name: vnp_ResponseCode
          in: query
          schema:
            type: string
            example: "00"
        - name: vnp_TxnRef
          in: query
          schema:
            type: string
        - name: vnp_Amount
          in: query
          schema:
            type: string
        - name: vnp_SecureHash
          in: query
          schema:
            type: string
      responses:
        "302":
          description: |
            - Thành công: Redirect về /candidate/history
            - Thất bại: Redirect về /payment/token với lỗi

  /payment/token/ipn:
    post:
      tags: [Payment]
      summary: VNPay IPN server-to-server (mua token)
      description: Endpoint này được VNPay gọi trực tiếp, không qua trình duyệt. Không cần auth.
      operationId: tokenIpn
      security: []
      requestBody:
