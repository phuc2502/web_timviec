        description:
          type: string
        roles:
          type: string
        predes:
          type: string
        address:
          type: string
          maxLength: 255
        job_type:
          type: string
          enum: [full-time, part-time, remote, freelance]
        salary:
          type: integer
          minimum: 0
        application_close_date:
          type: string
          format: date

    # ── Applications ─────────────────────────────────────────
    ApplyJobRequest:
      type: object
