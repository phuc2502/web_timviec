  # NOTIFICATIONS
  # ══════════════════════════════════════════════════════════════════

  /notifications:
    get:
      tags: [Notifications]
      summary: Danh sách thông báo
      description: |
        - Nếu gửi kèm `Accept: application/json` hoặc `X-Requested-With: XMLHttpRequest`
          → trả JSON (dùng cho notification bell dropdown).
        - Nếu request thông thường → trả HTML trang danh sách thông báo.
      operationId: notificationsIndex
      security:
        - cookieAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
            example: application/json
          description: Gửi `application/json` để nhận JSON response
      responses:
        "200":
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
            text/html:
              schema:
                type: string

  /notifications/read-all:
