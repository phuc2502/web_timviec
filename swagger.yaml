          type: string
          format: uri
          example: "https://abc.com"
        company_size:
          type: string
          enum: ["1-10", "11-50", "51-200", "201-500", "500+"]
          example: "11-50"

    UpdatePasswordRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        current_password:
          type: string
          format: password
          description: Bắt buộc nếu tài khoản đăng ký thường (không cần nếu OAuth chưa có password)
        password:
          type: string
          format: password
          minLength: 8
          example: "newpassword123"
        password_confirmation:
          type: string
          format: password
          example: "newpassword123"

    NotificationSettingsRequest:
      type: object
      properties:
        mail:
          type: boolean
          example: true
