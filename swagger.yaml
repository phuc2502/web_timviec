# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: web_timviec_session
      description: |
        Laravel session cookie. Để test bằng Postman:
        1. Gọi POST /login → Postman tự lưu cookie
        2. Gọi các endpoint tiếp theo → session cookie tự được gửi kèm
        3. Thêm header `X-CSRF-TOKEN` nếu gặp lỗi 419 (lấy từ response cookie `XSRF-TOKEN`)

  schemas:

    # ── Auth ────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: "password123"
        remember:
          type: boolean
          default: false
          description: Ghi nhớ đăng nhập

    RegisterEmployeeRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name:
          type: string
          maxLength: 255
          example: "Nguyễn Văn A"
        email:
          type: string
          format: email
          example: "nva@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "password123"
        password_confirmation:
          type: string
          format: password
          example: "password123"

    RegisterEmployerRequest:
      type: object
      required: [name, email, password, password_confirmation, company_name]
      properties:
        name:
          type: string
          maxLength: 255
          example: "Trần Thị B"
        email:
          type: string
          format: email
          example: "ttb@company.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "password123"
        password_confirmation:
          type: string
          format: password
          example: "password123"
        company_name:
          type: string
          maxLength: 255
          example: "Công ty TNHH ABC"

    # ── Jobs ─────────────────────────────────────────────────
    JobStoreRequest:
      type: object
      required: [title, description, address, job_type]
      properties:
        title:
          type: string
          maxLength: 255
          example: "Lập trình viên PHP Senior"
        description:
          type: string
          example: "Mô tả chi tiết công việc..."
        roles:
          type: string
          example: "Backend Developer"
          description: Vị trí/chức danh cụ thể
        predes:
          type: string
          example: "Yêu cầu 3 năm kinh nghiệm PHP/Laravel"
          description: Yêu cầu ứng viên
        address:
          type: string
          maxLength: 255
          example: "Quận 1, TP.HCM"
        job_type:
          type: string
          enum: [full-time, part-time, remote, freelance]
          example: full-time
        salary:
          type: integer
          minimum: 0
          example: 15000000
          description: Mức lương (VNĐ)
        application_close_date:
          type: string
          format: date
          example: "2026-08-31"
          description: Ngày đóng hồ sơ (phải sau ngày hôm nay)

    JobUpdateRequest:
      type: object
      required: [title, description, address, job_type]
      properties:
        title:
          type: string
