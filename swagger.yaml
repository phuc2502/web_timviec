openapi: 3.0.3
info:
  title: Web Tìm Việc API
  description: |
    Tài liệu API đầy đủ cho hệ thống **Web Tìm Việc** (Laravel).

    ## Xác thực
    Hầu hết các endpoint yêu cầu đăng nhập qua **Session Cookie** (Laravel Session).
    Để test bằng Postman:
    1. Gọi `POST /login` trước để lấy session cookie.
    2. Postman tự động lưu cookie — các request tiếp theo sẽ được xác thực.
    3. Thêm header `X-CSRF-TOKEN` (lấy từ meta tag trên trang) hoặc disable CSRF verification cho môi trường dev.

    ## Phân quyền
    - **Public** — Không cần đăng nhập
    - **Auth** — Cần đăng nhập
    - **Candidate** — Cần đăng nhập + role `employee`
    - **Employer** — Cần đăng nhập + role `employer`
    - **Admin** — Cần đăng nhập + role `admin`
  version: "1.0.0"
  contact:
    name: Web Tìm Việc Team

servers:
  - url: http://localhost/web_timviec/public
    description: XAMPP Local Server
  - url: http://127.0.0.1:8000
    description: Laravel Artisan Dev Server (php artisan serve)

tags:
  - name: Auth
    description: Đăng ký, Đăng nhập, Đăng xuất, Xác minh email
  - name: OAuth
    description: Đăng nhập qua Google / GitHub
  - name: Jobs
    description: Danh sách và quản lý tin tuyển dụng
  - name: Applications
    description: Ứng tuyển và theo dõi hồ sơ
  - name: CV
    description: Quản lý CV (upload & online builder)
  - name: Profile
    description: Hồ sơ cá nhân người dùng
  - name: Notifications
    description: Hệ thống thông báo
  - name: Payment
    description: Thanh toán VNPay (token & subscription)
  - name: Admin - Users
    description: Quản trị viên - Quản lý người dùng
  - name: Admin - Jobs
    description: Quản trị viên - Quản lý tin tuyển dụng
  - name: Admin - Transactions
    description: Quản trị viên - Lịch sử giao dịch
  - name: Admin - Notifications
    description: Quản trị viên - Quản lý thông báo hệ thống

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════════════════════════════

  /login:
    get:
      tags: [Auth]
      summary: Hiển thị trang đăng nhập
      operationId: showLogin
      security: []
      responses:
        "200":
          description: Trả về HTML trang đăng nhập
        "302":
          description: Redirect về /dashboard nếu đã đăng nhập

    post:
      tags: [Auth]
      summary: Đăng nhập tài khoản
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "302":
          description: |
            - Thành công: Redirect về dashboard (kèm session cookie)
            - Thất bại: Redirect về /login với lỗi validation
        "422":
          description: Validation error (email/password không đúng)

  /logout:
    post:
      tags: [Auth]
      summary: Đăng xuất
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "302":
          description: Redirect về /login

  /register:
    get:
      tags: [Auth]
      summary: Trang chọn loại tài khoản (employee / employer)
      operationId: showRegister
      security: []
      responses:
        "200":
          description: HTML trang chọn role

  /register/employee:
    get:
      tags: [Auth]
      summary: Form đăng ký ứng viên
      operationId: showRegisterEmployee
      security: []
      responses:
        "200":
          description: HTML form đăng ký ứng viên

    post:
      tags: [Auth]
      summary: Đăng ký tài khoản ứng viên
      operationId: registerEmployee
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterEmployeeRequest'
      responses:
        "302":
          description: |
            - Thành công: Redirect về /email/verify
            - Thất bại: Redirect về /register/employee với lỗi

  /register/employer:
    get:
      tags: [Auth]
      summary: Form đăng ký nhà tuyển dụng
      operationId: showRegisterEmployer
      security: []
      responses:
        "200":
          description: HTML form đăng ký nhà tuyển dụng

    post:
      tags: [Auth]
      summary: Đăng ký tài khoản nhà tuyển dụng
      operationId: registerEmployer
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterEmployerRequest'
      responses:
        "302":
          description: Redirect về /email/verify sau khi đăng ký thành công

  /forgot-password:
    get:
      tags: [Auth]
      summary: Form quên mật khẩu
      operationId: showForgotForm
      security: []
      responses:
        "200":
          description: HTML form nhập email

    post:
      tags: [Auth]
      summary: Gửi link đặt lại mật khẩu
      operationId: sendResetLink
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        "302":
          description: Redirect với thông báo gửi email thành công

  /reset-password/{token}:
    get:
      tags: [Auth]
      summary: Form đặt lại mật khẩu
      operationId: showResetForm
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HTML form đặt lại mật khẩu

  /reset-password:
    post:
      tags: [Auth]
      summary: Đặt lại mật khẩu
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                password_confirmation:
                  type: string
                  format: password
      responses:
        "302":
          description: Redirect về /login sau khi reset thành công

  /email/verify:
    get:
      tags: [Auth]
      summary: Trang thông báo xác minh email
      operationId: verificationNotice
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang thông báo

  /email/verification-notification:
    post:
      tags: [Auth]
      summary: Gửi lại email xác minh
      operationId: resendVerification
      security:
        - cookieAuth: []
      responses:
        "302":
          description: Redirect với thông báo đã gửi lại email

  # ══════════════════════════════════════════════════════════════════
  # OAUTH
  # ══════════════════════════════════════════════════════════════════

  /auth/google:
    get:
      tags: [OAuth]
      summary: Redirect đến Google OAuth
      operationId: googleRedirect
      security: []
      responses:
        "302":
          description: Redirect đến Google để xác thực

  /auth/google/callback:
    get:
      tags: [OAuth]
      summary: Callback từ Google OAuth
      operationId: googleCallback
      security: []
      responses:
        "302":
          description: Redirect về dashboard hoặc trang chọn role

  /auth/github:
    get:
      tags: [OAuth]
      summary: Redirect đến GitHub OAuth
      operationId: githubRedirect
      security: []
      responses:
        "302":
          description: Redirect đến GitHub để xác thực

  /auth/github/callback:
    get:
      tags: [OAuth]
      summary: Callback từ GitHub OAuth
      operationId: githubCallback
      security: []
      responses:
        "302":
          description: Redirect về dashboard hoặc trang chọn role

  # ══════════════════════════════════════════════════════════════════
  # JOBS (Public)
  # ══════════════════════════════════════════════════════════════════

  /job:
    get:
      tags: [Jobs]
      summary: Danh sách tin tuyển dụng (public)
      operationId: jobIndex
      security: []
      parameters:
        - name: search
          in: query
          description: Tìm kiếm theo tiêu đề hoặc mô tả
          schema:
            type: string
            example: "Lập trình viên"
        - name: address
          in: query
          description: Lọc theo địa điểm
          schema:
            type: string
            example: "Hà Nội"
        - name: job_type
          in: query
          description: Lọc theo loại hình công việc
          schema:
            type: string
            enum: [full-time, part-time, remote, freelance]
        - name: page
          in: query
          description: Số trang (phân trang 12 items/trang)
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: HTML trang danh sách công việc

  /job/show/{slug}:
    get:
      tags: [Jobs]
      summary: Chi tiết một tin tuyển dụng
      operationId: jobShow
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug của tin tuyển dụng
          schema:
            type: string
            example: lap-trinh-vien-php-abcdef
      responses:
        "200":
          description: HTML trang chi tiết công việc
        "404":
          description: Không tìm thấy tin

  # ══════════════════════════════════════════════════════════════════
  # JOBS (Employer - Quản lý tin)
  # ══════════════════════════════════════════════════════════════════

  /job/create:
    get:
      tags: [Jobs]
      summary: Form đăng tin tuyển dụng mới (Employer)
      operationId: jobCreate
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML form đăng tin
        "403":
          description: Không có quyền (không phải employer)

  /job/store:
    post:
      tags: [Jobs]
      summary: Lưu tin tuyển dụng mới (Employer)
      operationId: jobStore
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobStoreRequest'
      responses:
        "302":
          description: |
            - Thành công: Redirect về /job/manage
            - Thất bại: Redirect về /payment/subscription (hết quota free)
        "422":
          description: Validation error

  /job/manage:
    get:
      tags: [Jobs]
      summary: Quản lý danh sách tin đăng của employer
      operationId: jobManage
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang quản lý tin đăng

  /job/{id}/edit:
    get:
      tags: [Jobs]
      summary: Form chỉnh sửa tin tuyển dụng
      operationId: jobEdit
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML form chỉnh sửa
        "404":
          description: Không tìm thấy hoặc không có quyền

  /job/{id}/update:
    put:
      tags: [Jobs]
      summary: Cập nhật tin tuyển dụng (Employer)
      operationId: jobUpdate
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JobUpdateRequest'
      responses:
        "302":
          description: Redirect về /job/manage sau khi cập nhật

  /job/{id}/delete:
    delete:
      tags: [Jobs]
      summary: Xóa tin tuyển dụng (Employer)
      operationId: jobDestroy
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect về /job/manage sau khi xóa

  # ══════════════════════════════════════════════════════════════════
  # APPLICATIONS (Candidate)
  # ══════════════════════════════════════════════════════════════════

  /apply/{listingId}:
    get:
      tags: [Applications]
      summary: Form ứng tuyển công việc (Candidate)
      operationId: applyForm
      security:
        - cookieAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML form ứng tuyển (có autofill từ hồ sơ)
        "403":
          description: Không phải candidate

  /apply:
    post:
      tags: [Applications]
      summary: Nộp đơn ứng tuyển (Candidate)
      operationId: applySubmit
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyJobRequest'
      responses:
        "302":
          description: |
            - Thành công: Redirect về /candidate/history
            - Thất bại: Redirect về form với lỗi

  /candidate/history:
    get:
      tags: [Applications]
      summary: Lịch sử ứng tuyển của ứng viên
      operationId: candidateHistory
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang lịch sử ứng tuyển

  /candidate/applications/{id}:
    get:
      tags: [Applications]
      summary: Chi tiết đơn ứng tuyển của ứng viên
      operationId: candidateApplicationDetail
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML chi tiết đơn
        "404":
          description: Không tìm thấy đơn

  # ══════════════════════════════════════════════════════════════════
  # APPLICATIONS (Employer)
  # ══════════════════════════════════════════════════════════════════

  /employer/jobs/{listingId}/applicants:
    get:
      tags: [Applications]
      summary: Danh sách ứng viên theo tin đăng (Employer)
      operationId: applicantList
      security:
        - cookieAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML trang danh sách ứng viên

  /employer/applications/{id}:
    get:
      tags: [Applications]
      summary: Chi tiết hồ sơ ứng viên (Employer)
      description: Tự động chuyển trạng thái `submitted` → `viewed` khi employer xem.
      operationId: viewApplicationDetail
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: HTML chi tiết hồ sơ
        "404":
          description: Không tìm thấy

  /employer/applications/{id}/status:
    patch:
      tags: [Applications]
      summary: Cập nhật trạng thái đơn ứng tuyển (Employer)
      operationId: updateApplicationStatus
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [viewed, shortlisted, interview_scheduled, hired, rejected]
                  example: shortlisted
                interview_scheduled_at:
                  type: string
                  format: date-time
                  example: "2026-07-01T09:00:00"
                  description: Bắt buộc nếu status = interview_scheduled
      responses:
        "302":
          description: Redirect về trang trước với thông báo thành công/thất bại

  /shortlist/{listingId}/{applicantId}:
    post:
      tags: [Applications]
      summary: Toggle shortlist ứng viên (Employer)
      operationId: toggleShortlist
      security:
        - cookieAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: integer
        - name: applicantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "302":
          description: Redirect về trang trước

  # ══════════════════════════════════════════════════════════════════
  # CV (Candidate)
  # ══════════════════════════════════════════════════════════════════

  /user/cv:
    get:
      tags: [CV]
      summary: Trang quản lý CV (upload + online CV)
      operationId: cvPage
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang quản lý CV

    post:
      tags: [CV]
      summary: Upload file CV (PDF/DOC/DOCX, tối đa 5MB)
      operationId: uploadCv
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv_file]
              properties:
                cv_file:
                  type: string
                  format: binary
                  description: File CV (PDF, DOC, DOCX — tối đa 5MB)
      responses:
        "302":
          description: Redirect về /user/cv sau khi upload thành công
        "422":
          description: Validation error (sai định dạng hoặc vượt giới hạn)

  /user/cv/view:
    get:
      tags: [CV]
      summary: Xem file CV đã upload (inline trong trình duyệt)
      operationId: viewCv
      security:
        - cookieAuth: []
      responses:
        "200":
          description: File CV (PDF/DOC)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "302":
          description: Redirect về /user/cv nếu chưa có CV

  /user/cv/create:
    get:
      tags: [CV]
      summary: Form tạo/chỉnh sửa CV online
      operationId: createCv
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML form CV online builder

  /user/cv/preview:
    get:
      tags: [CV]
      summary: Xem preview CV online
      operationId: showCvPreview
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML preview CV theo template đã chọn
        "302":
          description: Redirect về /user/cv/create nếu chưa có dữ liệu

    post:
      tags: [CV]
      summary: Lưu dữ liệu CV online
      operationId: saveCv
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CvFormRequest'
      responses:
        "302":
          description: Redirect về /user/cv/preview sau khi lưu

  /user/cv/download:
    get:
      tags: [CV]
      summary: Tải xuống CV dạng PDF
      operationId: downloadCvPdf
      security:
        - cookieAuth: []
      responses:
        "200":
          description: File PDF CV
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /user/cv/online:
    delete:
      tags: [CV]
      summary: Xóa CV online
      operationId: deleteOnlineCv
      security:
        - cookieAuth: []
      responses:
        "302":
          description: Redirect về /user/cv/create sau khi xóa

  /user/cv/ai-parse:
    post:
      tags: [CV]
      summary: Trích xuất thông tin CV bằng AI (Gemini)
      description: |
        Upload file PDF và AI sẽ tự động phân tích, trả về JSON với thông tin
        họ tên, email, phone, kinh nghiệm, học vấn, kỹ năng…
        **Rate limit**: 5 lần/60 phút.
      operationId: aiParseCv
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv_file]
              properties:
                cv_file:
                  type: string
                  format: binary
                  description: File PDF chứa CV (phải có text, không phải ảnh scan)
      responses:
        "200":
          description: Dữ liệu CV được trích xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiParseCvResponse'
        "422":
          description: File không hợp lệ hoặc không chứa text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Lỗi AI hoặc lỗi hệ thống
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "503":
          description: AI quá tải (vượt giới hạn lượt gọi)

  # ══════════════════════════════════════════════════════════════════
  # PROFILE
  # ══════════════════════════════════════════════════════════════════

  /user/profile:
    get:
      tags: [Profile]
      summary: Trang hồ sơ cá nhân
      operationId: profileShow
      security:
        - cookieAuth: []
      responses:
        "200":
          description: HTML trang hồ sơ

  /user/profile/employee:
    post:
      tags: [Profile]
      summary: Cập nhật hồ sơ ứng viên
      operationId: updateEmployeeProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeProfileRequest'
      responses:
        "302":
          description: Redirect về /user/profile với thông báo thành công

  /user/profile/employer:
    post:
      tags: [Profile]
      summary: Cập nhật hồ sơ nhà tuyển dụng
      operationId: updateEmployerProfile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateEmployerProfileRequest'
      responses:
        "302":
          description: Redirect về /user/profile với thông báo thành công

