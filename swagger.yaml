        notify_shortlist:
          type: boolean
          example: true
          description: Thông báo khi được shortlist
        notify_app_status:
          type: boolean
          example: true
          description: Thông báo khi trạng thái hồ sơ thay đổi
        notify_job_alert:
          type: boolean
          example: false
          description: Thông báo việc làm mới phù hợp

