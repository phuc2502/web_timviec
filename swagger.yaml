      tags: [Notifications]
      summary: Đánh dấu tất cả thông báo là đã đọc
      operationId: markAllNotificationsRead
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK (JSON nếu AJAX)
          content:
            application/json:
              schema:
