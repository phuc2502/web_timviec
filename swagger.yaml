          type: string
          example: "Nguyễn Văn A"
        applicant_email:
          type: string
          format: email
          example: "nva@example.com"
        applicant_phone:
          type: string
          example: "0901234567"
        cover_letter:
          type: string
          example: "Tôi rất quan tâm đến vị trí này..."
        cv_file:
          type: string
          format: binary
          description: File CV mới (tùy chọn, nếu không gửi sẽ dùng CV đã upload)
        cv_id:
          type: integer
          description: ID của CV đã upload trước (tùy chọn)

    # ── CV ───────────────────────────────────────────────────
    CvFormRequest:
      type: object
      properties:
        full_name:
          type: string
          example: "Nguyễn Văn A"
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
        address:
          type: string
          example: "Hà Nội"
        objective:
          type: string
          example: "Mục tiêu nghề nghiệp..."
        skills_text:
          type: string
          example: "PHP, Laravel, Vue.js, MySQL"
        education:
          type: string
          description: JSON string danh sách học vấn
          example: '[{"school":"Đại học Bách Khoa","degree":"Kỹ sư CNTT","year_start":"2018","year_end":"2022"}]'
        experience:
          type: string
          description: JSON string danh sách kinh nghiệm
          example: '[{"company":"ABC Corp","role":"Backend Dev","year_start":"2022","year_end":"2024","description":"Phát triển API"}]'
        projects:
          type: string
          description: JSON string danh sách dự án
        certifications:
          type: string
          description: JSON string danh sách chứng chỉ
        languages:
          type: string
          description: JSON string danh sách ngôn ngữ
        template:
          type: string
          description: Template CV
          enum: [default, modern, classic]
          example: modern
        photo:
          type: string
          format: binary
          description: Ảnh đại diện CV (JPG/PNG, tối đa 2MB)

    AiParseCvResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            full_name:
              type: string
              example: "Nguyễn Văn A"
            email:
              type: string
              example: "nva@example.com"
            phone:
              type: string
              example: "0901234567"
            address:
              type: string
              example: "Hà Nội"
            objective:
              type: string
            skills_text:
              type: string
              example: "PHP, Laravel, MySQL, Vue.js"
            education:
              type: array
              items:
                type: object
                properties:
                  school: { type: string }
                  degree: { type: string }
                  year_start: { type: string }
                  year_end: { type: string }
            experience:
              type: array
              items:
                type: object
                properties:
                  company: { type: string }
                  role: { type: string }
                  year_start: { type: string }
                  year_end: { type: string }
                  description: { type: string }
            projects:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  role: { type: string }
                  description: { type: string }
            certifications:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  year: { type: string }
            languages:
              type: array
              items:
                type: object
                properties:
                  language: { type: string }
                  level: { type: string }

    # ── Profile ──────────────────────────────────────────────
    UpdateEmployeeProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: "Nguyễn Văn A"
        about:
          type: string
          maxLength: 2000
        profile_pic:
          type: string
          format: binary
          description: Ảnh đại diện (JPG/PNG/WebP, tối đa 2MB)
        skills:
          type: array
          items:
            type: string
          example: ["PHP", "Laravel", "Vue.js"]
        experience_years:
          type: integer
          minimum: 0
          maximum: 50
          example: 3
        desired_salary:
          type: integer
          minimum: 0
          example: 20000000
        location:
          type: string
          maxLength: 255
          example: "Hà Nội"
        job_type_pref:
          type: string
          enum: [full-time, part-time, remote, freelance]
          example: remote

    UpdateEmployerProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
          example: "Trần Thị B"
        about:
          type: string
          maxLength: 2000
        profile_pic:
          type: string
          format: binary
          description: Ảnh đại diện (JPG/PNG/WebP, tối đa 2MB)
        company_name:
          type: string
          maxLength: 255
          example: "Công ty TNHH ABC"
        company_logo:
          type: string
          format: binary
          description: Logo công ty (JPG/PNG/WebP, tối đa 2MB)
